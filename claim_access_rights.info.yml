name: 'Claim Access Rights'
type: module
description: 'Allows users to claim granular access rights (view, edit) on entities with configurable Exclusive, Replace, or Append modes, automated approval via ECA, and access expiry.'
core_version_requirement: ^10 || ^11 || ^12
package: 'Access control'
dependencies:
  - drupal:node
  - drupal:user
  - webform:webform
  - webform:webform_ui
  - eca:eca
  - eca:eca_content
  - eca:eca_ui
  - bpmn_io:bpmn_io
