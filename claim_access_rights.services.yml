services:
  claim_access_rights.manager:
    class: Drupal\claim_access_rights\ClaimAccessManager
    arguments:
      - '@database'
      - '@config.factory'
      - '@datetime.time'
      - '@cache_tags.invalidator'
      - '@logger.factory'
      - '@lock'
      - '@entity_type.manager'

  claim_access_rights.submission_processor:
    class: Drupal\claim_access_rights\ClaimSubmissionProcessor
    arguments:
      - '@claim_access_rights.manager'
      - '@entity_type.manager'

  claim_access_rights.access_check.user_claims:
    class: Drupal\claim_access_rights\Access\UserClaimsAccessCheck
    tags:
      - { name: access_check, applies_to: _claim_access_user_check }

  claim_access_rights.route_subscriber:
    class: Drupal\claim_access_rights\Routing\ClaimAccessRightsRouteSubscriber
    tags:
      - { name: event_subscriber }

  claim_access_rights.banner_builder:
    class: Drupal\claim_access_rights\ClaimAccessBannerBuilder
    arguments:
      - '@claim_access_rights.manager'
      - '@entity_type.manager'
      - '@current_user'
      - '@date.formatter'
