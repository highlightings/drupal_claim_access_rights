claim_access_rights.settings:
  type: config_object
  label: 'Claim Access Rights settings'
  mapping:
    enabled_entity_types:
      type: sequence
      label: 'Enabled Entity Types and Bundles'
      sequence:
        type: sequence
        sequence:
          type: string
    enabled_bundles:
      type: sequence
      label: 'Enabled Content Types (Legacy)'
      sequence:
        type: string
    claim_mode:
      type: string
      label: 'Default Claim Access Mode (exclusive, replace, append)'
    allowed_rights:
      type: sequence
      label: 'Allowed Claimable Rights'
      sequence:
        type: string
    default_expiry_days:
      type: integer
      label: 'Default Expiry in Days'
    expiry_type:
      type: string
      label: 'Expiry type (none, days, date)'
    auto_approval_mode:
      type: string
      label: 'Approval Mode (eca, immediate, manual)'
    notification_email:
      type: string
      label: 'Admin Notification Email'
    allow_permanent_claims:
      type: boolean
      label: 'Allow users to request permanent access'
    max_claim_days:
      type: integer
      label: 'Maximum access window in days (0 = unlimited)'
    max_active_claims_per_user:
      type: integer
      label: 'Maximum active claims per user (0 = unlimited)'
    user_extension_auto_approve:
      type: boolean
      label: 'Auto-approve extension requests from claimants'
