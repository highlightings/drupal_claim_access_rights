claim_access_rights.settings:
  path: '/admin/config/people/claim-access-rights'
  defaults:
    _form: '\Drupal\claim_access_rights\Form\ClaimAccessSettingsForm'
    _title: 'Claim Access Rights Settings'
  requirements:
    _permission: 'administer claim access rights'

claim_access_rights.revoke_grant:
  path: '/admin/content/claims/{grant_id}/revoke'
  defaults:
    _form: '\Drupal\claim_access_rights\Form\ClaimGrantRevokeForm'
    _title: 'Revoke Claim Access Grant'
  requirements:
    _permission: 'administer claim access rights'

claim_access_rights.extend_grant:
  path: '/admin/content/claims/{grant_id}/extend'
  defaults:
    _form: '\Drupal\claim_access_rights\Form\ClaimGrantExtendForm'
    _title: 'Extend Claim Access Grant'
  requirements:
    _permission: 'administer claim access rights'

claim_access_rights.delete_grant:
  path: '/admin/content/claims/{grant_id}/delete'
  defaults:
    _form: '\Drupal\claim_access_rights\Form\ClaimGrantDeleteForm'
    _title: 'Delete Claim Access Grant'
  requirements:
    _permission: 'administer claim access rights'

claim_access_rights.user_request_extension:
  path: '/user/claims/{grant_id}/request-extension'
  defaults:
    _form: '\Drupal\claim_access_rights\Form\ClaimUserExtensionRequestForm'
    _title: 'Request Access Extension'
  requirements:
    _custom_access: '\Drupal\claim_access_rights\Form\ClaimUserExtensionRequestForm::access'

claim_access_rights.my_claims_redirect:
  path: '/my-claims'
  defaults:
    _controller: '\Drupal\claim_access_rights\Controller\MyClaimsRedirectController::redirectMyClaims'
    _title: 'My Access Claims'
  requirements:
    _user_is_logged_in: 'TRUE'

claim_access_rights.pending:
  path: '/admin/content/claims/pending'
  defaults:
    _controller: '\Drupal\claim_access_rights\Controller\PendingClaimsController::list'
    _title: 'Pending access claims'
  requirements:
    _permission: 'administer claim access rights'

claim_access_rights.pending_approve:
  path: '/admin/content/claims/pending/{webform_submission}/approve'
  defaults:
    _form: '\Drupal\claim_access_rights\Form\ClaimSubmissionApproveForm'
    _title: 'Approve claim'
  requirements:
    _custom_access: '\Drupal\claim_access_rights\Form\ClaimSubmissionApproveForm::access'
  options:
    parameters:
      webform_submission:
        type: entity:webform_submission

claim_access_rights.pending_reject:
  path: '/admin/content/claims/pending/{webform_submission}/reject'
  defaults:
    _form: '\Drupal\claim_access_rights\Form\ClaimSubmissionRejectForm'
    _title: 'Reject claim'
  requirements:
    _custom_access: '\Drupal\claim_access_rights\Form\ClaimSubmissionRejectForm::access'
  options:
    parameters:
      webform_submission:
        type: entity:webform_submission
